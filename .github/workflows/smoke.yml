name: Live smoke test

# Talks to the real YouTube. Not part of CI because it can fail for reasons
# outside this repo (YouTube changing something, or blocking GitHub's runner IPs).
# A failure here is the early warning to run: pip install -U yt-dlp youtube-transcript-api
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Fetch one short video (https://youtu.be/jNQXAC9IVRw)
        run: |
          set +e
          clawtube video jNQXAC9IVRw --out smoke_out 2>&1 | tee smoke.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] && grep -q "not a bot" smoke.log; then
            # YouTube often walls off GitHub's own runner IPs entirely. That says
            # nothing about clawtube, so report it as inconclusive, not a failure.
            echo "::warning::YouTube bot-checked this GitHub runner's IP; smoke test inconclusive"
            exit 0
          fi
          test "$status" -eq 0
          grep -q "^## Transcript" smoke_out/*.md
          ! grep -q "<c>" smoke_out/*.md  # no raw VTT timing tags may leak into the output
