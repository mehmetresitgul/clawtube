name: Release

# Push a tag like v0.1.0 to publish. Requires a PyPI "trusted publisher"
# configured for this repo/workflow (see RELEASING.md); no API token needed.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine pytest
      - run: pip install -e . && pytest -q
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Tag matches package version
        run: |
          v=$(python -c "import clawtube; print(clawtube.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
